[project]
name = "footsteps"
version = "0.1.0"
description = "Discovering named behaviours in LLM agent trajectories and testing if they flag failing runs early."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "hmmlearn>=0.3.3",
    "huggingface-hub>=2.0.0",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
footsteps = "footsteps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# hmmlearn reshapes arrays in a way NumPy 2.5 flags, and the result is unaffected.
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning"]

[tool.ruff]
src = ["src", "tests"]
